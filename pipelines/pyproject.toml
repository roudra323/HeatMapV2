[project]
name = "heatmap-pipelines"
version = "0.1.0"
description = "Dagster assets, jobs and schedules for HeatMap"
requires-python = ">=3.12"
dependencies = [
    "dagster>=1.8",
    "dagster-webserver>=1.8",
    "heatmap-core",
]

[tool.uv.sources]
heatmap-core = { workspace = true }

[tool.dagster]
module_name = "heatmap_pipelines.definitions"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/heatmap_pipelines"]
