# Base Configuration
api:
  title: "HeatMap API"
  version: "1.0.0"
  cors_origins:
    - "http://localhost:3000"
    - "http://localhost:3001"

collector:
  max_retries: 3
  timeout: 30
  batch_size: 100
  rate_limit: 5  # requests per second
  uniswap:
    minimal_data: true  # If true, only fetch essential fields (sender, recipient, timestamp, amountUSD)
    default_limit: 1000
    default_skip: 0

analyzer:
  use_minimal_data: true  # If true, load cleaned test data from minimal_data for ML analysis
  minimal_data_path: "minimal_data"  # Path to minimal test data directory
  clustering:
    n_clusters: 5
    min_samples: 10
  network:
    max_depth: 3
    min_connections: 2
  
output:
  format: csv
  save_intermediate: true