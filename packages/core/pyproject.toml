[project]
name = "heatmap-core"
version = "0.1.0"
description = "Domain library: providers, ingestion, graph, features and models"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "httpx>=0.27",
    "networkx>=3.3",
    "numpy>=1.26",
    "polars>=1.5",
    "psycopg[binary]>=3.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "scikit-learn>=1.5",
    "sqlalchemy>=2.0.32",
    "structlog>=24.4",
    "tenacity>=9.0",
]

[project.scripts]
heatmap = "heatmap_core.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/heatmap_core"]
