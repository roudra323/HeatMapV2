services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: heatmap
      POSTGRES_PASSWORD: heatmap
      POSTGRES_DB: heatmap
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heatmap"]
      interval: 5s
      retries: 10

  migrate:
    build: { context: ., dockerfile: infra/docker/python.Dockerfile }
    env_file: [.env]
    environment:
      HEATMAP_DATABASE_URL: postgresql+psycopg://heatmap:heatmap@postgres:5432/heatmap
    command: ["alembic", "-c", "packages/core/alembic.ini", "upgrade", "head"]
    depends_on:
      postgres: { condition: service_healthy }

  api:
    build: { context: ., dockerfile: infra/docker/python.Dockerfile }
    env_file: [.env]
    environment:
      HEATMAP_DATABASE_URL: postgresql+psycopg://heatmap:heatmap@postgres:5432/heatmap
    command: ["uvicorn", "heatmap_api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["8000:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  dagster-webserver:
    build: { context: ., dockerfile: infra/docker/python.Dockerfile }
    env_file: [.env]
    environment: &dagster_env
      HEATMAP_DATABASE_URL: postgresql+psycopg://heatmap:heatmap@postgres:5432/heatmap
      DAGSTER_HOME: /opt/dagster/home
    command: ["dagster-webserver", "-h", "0.0.0.0", "-p", "3001", "-m", "heatmap_pipelines.definitions"]
    ports: ["3001:3001"]
    volumes: [dagster_home:/opt/dagster/home]
    depends_on:
      migrate: { condition: service_completed_successfully }

  dagster-daemon:
    build: { context: ., dockerfile: infra/docker/python.Dockerfile }
    env_file: [.env]
    environment: *dagster_env
    command: ["dagster-daemon", "run", "-m", "heatmap_pipelines.definitions"]
    volumes: [dagster_home:/opt/dagster/home]
    depends_on:
      migrate: { condition: service_completed_successfully }

  web:
    build:
      context: apps/web
      dockerfile: ../../infra/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000 # as seen from the browser
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  pgdata:
  dagster_home:
