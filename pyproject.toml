[project]
name = "heatmap"
version = "0.1.0"
description = "Wallet tracking, behaviour modelling and neighbourhood analysis for EVM chains"
requires-python = ">=3.12"
dependencies = [
    "heatmap-core",
    "heatmap-api",
    "heatmap-pipelines",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/core", "apps/api", "pipelines"]

[tool.uv.sources]
heatmap-core = { workspace = true }
heatmap-api = { workspace = true }
heatmap-pipelines = { workspace = true }

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pre-commit>=3.8",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["apps/web"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PL", "TID"]
ignore = ["PLR0913", "PLR0917", "PLR2004", "PLR0911", "PLR0912", "PLR0915", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "S101", "RUF001"]  # spam tests use homoglyphs on purpose
"**/migrations/versions/*.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["heatmap_core", "heatmap_api", "heatmap_pipelines"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "packages/core/src:apps/api/src:pipelines/src"
explicit_package_bases = true
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["sklearn.*", "networkx.*", "dagster.*", "polars.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: requires a PostgreSQL database (HEATMAP_TEST_DATABASE_URL)",
    "live: calls real provider APIs (needs provider keys in env)",
]
